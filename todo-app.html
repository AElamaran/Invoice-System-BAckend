<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do List App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .todo-form {
            padding: 30px;
            border-bottom: 1px solid #eee;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .todo-input {
            flex: 1;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .todo-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 15px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .btn-edit {
            background: #28a745;
            color: white;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .btn-edit:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
            padding: 8px 12px;
            font-size: 0.8rem;
        }

        .btn-cancel:hover {
            background: #5a6268;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
            background: #f8f9fa;
            padding: 15px;
        }

        .stat {
            color: #666;
        }

        .stat-number {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: #333;
        }

        .todo-list {
            padding: 0;
        }

        .todo-item {
            display: flex;
            align-items: center;
            padding: 20px 30px;
            border-bottom: 1px solid #eee;
            transition: all 0.3s ease;
            background: white;
        }

        .todo-item:hover {
            background: #f8f9fa;
        }

        .todo-item.completed {
            opacity: 0.7;
            background: #f1f8e9;
        }

        .todo-checkbox {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-text {
            flex: 1;
            font-size: 1.1rem;
            color: #333;
        }

        .todo-text.completed {
            text-decoration: line-through;
            color: #888;
        }

        .todo-actions {
            display: flex;
            gap: 8px;
        }

        .edit-input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #667eea;
            border-radius: 4px;
            font-size: 1.1rem;
            margin-right: 10px;
        }

        .edit-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 60px 30px;
            color: #888;
        }

        .empty-state h3 {
            margin-bottom: 10px;
            color: #666;
        }

        .filters {
            padding: 0 30px 20px 30px;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #eee;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-btn:hover {
            border-color: #667eea;
        }

        @media (max-width: 480px) {
            .container {
                margin: 0;
                border-radius: 0;
            }

            .input-group {
                flex-direction: column;
            }

            .btn {
                padding: 12px 20px;
            }

            .todo-item {
                padding: 15px 20px;
            }

            .todo-actions {
                flex-direction: column;
                gap: 5px;
            }

            .filter-buttons {
                flex-wrap: wrap;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 To-Do List</h1>
            <p>Stay organized and get things done!</p>
        </div>

        <div class="todo-form">
            <div class="input-group">
                <input type="text" id="todoInput" class="todo-input" placeholder="What needs to be done?" maxlength="200">
                <button onclick="addTodo()" class="btn btn-primary">Add Task</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat">
                <span class="stat-number" id="totalTasks">0</span>
                <span>Total</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="completedTasks">0</span>
                <span>Completed</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="pendingTasks">0</span>
                <span>Pending</span>
            </div>
        </div>

        <div class="filters">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="filterTodos('all')">All</button>
                <button class="filter-btn" onclick="filterTodos('pending')">Pending</button>
                <button class="filter-btn" onclick="filterTodos('completed')">Completed</button>
            </div>
        </div>

        <div id="todoList" class="todo-list">
            <div class="empty-state">
                <h3>No tasks yet</h3>
                <p>Add your first task above to get started!</p>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let todos = [];
        let currentFilter = 'all';
        let editingId = null;

        // Initialize the app
        document.addEventListener('DOMContentLoaded', function() {
            loadTodos();
            renderTodos();
            updateStats();

            // Add event listener for Enter key in input
            document.getElementById('todoInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    addTodo();
                }
            });
        });

        // Load todos from localStorage
        function loadTodos() {
            const savedTodos = localStorage.getItem('todos');
            if (savedTodos) {
                todos = JSON.parse(savedTodos);
            }
        }

        // Save todos to localStorage
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // Generate unique ID
        function generateId() {
            return Date.now() + Math.random().toString(36).substr(2, 9);
        }

        // Add new todo
        function addTodo() {
            const input = document.getElementById('todoInput');
            const text = input.value.trim();

            if (text === '') {
                alert('Please enter a task!');
                return;
            }

            const newTodo = {
                id: generateId(),
                text: text,
                completed: false,
                createdAt: new Date().toISOString()
            };

            todos.unshift(newTodo);
            input.value = '';
            saveTodos();
            renderTodos();
            updateStats();
            
            // Show success feedback
            showFeedback('Task added successfully!', 'success');
        }

        // Toggle todo completion
        function toggleTodo(id) {
            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.completed = !todo.completed;
                saveTodos();
                renderTodos();
                updateStats();
                
                const message = todo.completed ? 'Task completed!' : 'Task marked as pending!';
                showFeedback(message, 'info');
            }
        }

        // Delete todo
        function deleteTodo(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                todos = todos.filter(t => t.id !== id);
                saveTodos();
                renderTodos();
                updateStats();
                showFeedback('Task deleted successfully!', 'warning');
            }
        }

        // Start editing todo
        function editTodo(id) {
            editingId = id;
            renderTodos();
        }

        // Save edited todo
        function saveEdit(id, newText) {
            const trimmedText = newText.trim();
            if (trimmedText === '') {
                alert('Task cannot be empty!');
                return;
            }

            const todo = todos.find(t => t.id === id);
            if (todo) {
                todo.text = trimmedText;
                editingId = null;
                saveTodos();
                renderTodos();
                showFeedback('Task updated successfully!', 'success');
            }
        }

        // Cancel editing
        function cancelEdit() {
            editingId = null;
            renderTodos();
        }

        // Filter todos
        function filterTodos(filter) {
            currentFilter = filter;
            
            // Update active filter button
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            renderTodos();
        }

        // Get filtered todos
        function getFilteredTodos() {
            switch (currentFilter) {
                case 'completed':
                    return todos.filter(t => t.completed);
                case 'pending':
                    return todos.filter(t => !t.completed);
                default:
                    return todos;
            }
        }

        // Render todos
        function renderTodos() {
            const todoList = document.getElementById('todoList');
            const filteredTodos = getFilteredTodos();

            if (filteredTodos.length === 0) {
                todoList.innerHTML = `
                    <div class="empty-state">
                        <h3>${getEmptyStateMessage()}</h3>
                        <p>${getEmptyStateSubtext()}</p>
                    </div>
                `;
                return;
            }

            todoList.innerHTML = filteredTodos.map(todo => {
                if (editingId === todo.id) {
                    return `
                        <div class="todo-item">
                            <input type="checkbox" ${todo.completed ? 'checked' : ''} 
                                   onchange="toggleTodo('${todo.id}')" class="todo-checkbox">
                            <input type="text" value="${escapeHtml(todo.text)}" 
                                   class="edit-input" id="editInput${todo.id}" maxlength="200"
                                   onkeypress="if(event.key==='Enter') saveEdit('${todo.id}', this.value)"
                                   onkeyup="if(event.key==='Escape') cancelEdit()">
                            <div class="todo-actions">
                                <button onclick="saveEdit('${todo.id}', document.getElementById('editInput${todo.id}').value)" 
                                        class="btn btn-primary">Save</button>
                                <button onclick="cancelEdit()" class="btn btn-cancel">Cancel</button>
                            </div>
                        </div>
                    `;
                } else {
                    return `
                        <div class="todo-item ${todo.completed ? 'completed' : ''}">
                            <input type="checkbox" ${todo.completed ? 'checked' : ''} 
                                   onchange="toggleTodo('${todo.id}')" class="todo-checkbox">
                            <span class="todo-text ${todo.completed ? 'completed' : ''}">${escapeHtml(todo.text)}</span>
                            <div class="todo-actions">
                                <button onclick="editTodo('${todo.id}')" class="btn btn-edit">Edit</button>
                                <button onclick="deleteTodo('${todo.id}')" class="btn btn-delete">Delete</button>
                            </div>
                        </div>
                    `;
                }
            }).join('');

            // Focus on edit input if editing
            if (editingId) {
                const editInput = document.getElementById(`editInput${editingId}`);
                if (editInput) {
                    editInput.focus();
                    editInput.select();
                }
            }
        }

        // Update statistics
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(t => t.completed).length;
            const pending = total - completed;

            document.getElementById('totalTasks').textContent = total;
            document.getElementById('completedTasks').textContent = completed;
            document.getElementById('pendingTasks').textContent = pending;
        }

        // Get empty state message based on current filter
        function getEmptyStateMessage() {
            switch (currentFilter) {
                case 'completed':
                    return 'No completed tasks';
                case 'pending':
                    return 'No pending tasks';
                default:
                    return 'No tasks yet';
            }
        }

        // Get empty state subtext based on current filter
        function getEmptyStateSubtext() {
            switch (currentFilter) {
                case 'completed':
                    return 'Complete some tasks to see them here!';
                case 'pending':
                    return 'All tasks completed! Great job! 🎉';
                default:
                    return 'Add your first task above to get started!';
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Show feedback message
        function showFeedback(message, type) {
            // Create feedback element
            const feedback = document.createElement('div');
            feedback.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                border-radius: 8px;
                color: white;
                font-weight: 600;
                z-index: 1000;
                opacity: 0;
                transform: translateX(100px);
                transition: all 0.3s ease;
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            `;

            // Set background color based on type
            const colors = {
                success: '#28a745',
                warning: '#ffc107',
                info: '#17a2b8'
            };
            feedback.style.backgroundColor = colors[type] || colors.info;
            feedback.textContent = message;

            // Add to page
            document.body.appendChild(feedback);

            // Animate in
            setTimeout(() => {
                feedback.style.opacity = '1';
                feedback.style.transform = 'translateX(0)';
            }, 100);

            // Remove after 3 seconds
            setTimeout(() => {
                feedback.style.opacity = '0';
                feedback.style.transform = 'translateX(100px)';
                setTimeout(() => {
                    document.body.removeChild(feedback);
                }, 300);
            }, 3000);
        }

        // Clear all completed tasks
        function clearCompleted() {
            if (confirm('Are you sure you want to delete all completed tasks?')) {
                todos = todos.filter(t => !t.completed);
                saveTodos();
                renderTodos();
                updateStats();
                showFeedback('Completed tasks cleared!', 'warning');
            }
        }

        // Add keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Escape key to cancel editing
            if (e.key === 'Escape' && editingId) {
                cancelEdit();
            }
            
            // Ctrl/Cmd + / to focus on input
            if ((e.ctrlKey || e.metaKey) && e.key === '/') {
                e.preventDefault();
                document.getElementById('todoInput').focus();
            }
        });
    </script>
</body>
</html>
